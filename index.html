<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiki Engine - A Tcl/Tk Game Engine</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #0f1410;
    color: #e8e6e3;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    text-align: center;
    padding: 48px 40px;
    max-width: 560px;
  }
  .logo { width: 96px; height: 96px; margin: 0 auto 24px; }
  h1 {
    font-size: 42px;
    letter-spacing: 6px;
    color: #f4a259;
    margin-bottom: 8px;
  }
  .tagline {
    font-size: 16px;
    color: #2dd4bf;
    letter-spacing: 2px;
    margin-bottom: 32px;
  }
  .features {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-bottom: 36px;
    flex-wrap: wrap;
  }
  .feature {
    background: #1a221c;
    border: 1px solid #2a352d;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 13px;
    color: #b8b5b0;
  }
  .btn {
    display: inline-block;
    background: #f4a259;
    color: #0f1410;
    text-decoration: none;
    font-weight: 600;
    padding: 12px 32px;
    border-radius: 8px;
    letter-spacing: 1px;
  }
  .btn:hover { background: #e8955a; }
  .footer {
    margin-top: 40px;
    font-size: 12px;
    color: #555;
  }
</style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
      <rect x="18" y="8" width="60" height="80" rx="12" fill="#f4a259"/>
      <rect x="28" y="26" width="16" height="16" rx="3" fill="#0f1410"/>
      <rect x="52" y="26" width="16" height="16" rx="3" fill="#0f1410"/>
      <rect x="33" y="31" width="6" height="6" fill="#2dd4bf"/>
      <rect x="57" y="31" width="6" height="6" fill="#2dd4bf"/>
      <rect x="30" y="58" width="36" height="10" rx="4" fill="#0f1410"/>
      <rect x="40" y="58" width="4" height="10" fill="#f4a259"/>
      <rect x="52" y="58" width="4" height="10" fill="#f4a259"/>
      <rect x="12" y="40" width="8" height="20" rx="3" fill="#f4a259"/>
      <rect x="76" y="40" width="8" height="20" rx="3" fill="#f4a259"/>
    </svg>
    <h1>TIKI ENGINE</h1>
    <p class="tagline">A Tcl/Tk Game Engine</p>
    <div class="features">
      <div class="feature">DirectX 12 Renderer</div>
      <div class="feature">Tcl Scripted Gameplay</div>
      <div class="feature">Lightweight &amp; Embeddable</div>
    </div>
    <a class="btn" href="https://github.com/Lanurence666/tiki-engine">View on GitHub</a>
    <p class="footer">Coming soon &middot; &copy; 2026 Tiki Engine</p>
  </div>
</body>
</html>
